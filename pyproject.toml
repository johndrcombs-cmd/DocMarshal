[project]
name = "docmarshal"
version = "1.0.0"
description = "Safety-first desktop review and filing for fleet compliance documents"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "John Combs" }]
keywords = ["document-automation", "fleet", "dot", "pdf", "tkinter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/johndrcombs-cmd/DocMarshal"
Repository = "https://github.com/johndrcombs-cmd/DocMarshal"
Issues = "https://github.com/johndrcombs-cmd/DocMarshal/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
